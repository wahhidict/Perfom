<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وصفات التجهيز — للتاجر</title>
<style>
body{font-family:'Tajawal',system-ui,sans-serif;background:#0a0e1a;color:#f5f0e8;padding:20px;line-height:1.7}
h1{color:#c9a86a;text-align:center;margin-bottom:8px;font-size:22px}
.sub{text-align:center;color:#8a8578;font-size:13px;margin-bottom:24px}
.search{width:100%;max-width:500px;margin:0 auto 24px;display:block;padding:14px 18px;background:#131824;border:1.5px solid rgba(201,168,106,.3);border-radius:12px;color:#f5f0e8;font-family:inherit;font-size:15px}
.blend{background:#131824;border:1px solid rgba(201,168,106,.22);border-radius:14px;padding:18px;margin-bottom:14px;max-width:700px;margin-inline:auto}
.blend h2{color:#c9a86a;font-size:20px;margin-bottom:4px}
.blend .key{font-size:12px;color:#8a8578;margin-bottom:12px}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.notes span{padding:4px 10px;background:rgba(201,168,106,.1);border:1px solid rgba(201,168,106,.2);border-radius:999px;font-size:12px;color:#e0c48a}
.size-tabs{display:flex;gap:8px;margin-bottom:12px}
.size-tabs button{padding:6px 14px;background:#1c2230;border:1px solid rgba(201,168,106,.2);border-radius:8px;color:#f5f0e8;cursor:pointer;font-family:inherit;font-size:13px}
.size-tabs button.active{background:#c9a86a;color:#0a0e1a;border-color:#c9a86a;font-weight:700}
.recipe{background:#0a0e1a;border-radius:10px;padding:14px}
.recipe-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(201,168,106,.1);font-size:14px}
.recipe-item:last-child{border-bottom:none}
.recipe-item .ml{color:#c9a86a;font-weight:700}
.total{padding-top:10px;margin-top:8px;border-top:2px solid rgba(201,168,106,.3);display:flex;justify-content:space-between;font-weight:700}
</style>
</head>
<body>
<h1>🔒 وصفات التجهيز</h1>
<p class="sub">صفحة خاصة — لا تشاركها مع أحد</p>
<input class="search" id="search" placeholder="ابحث باسم الخلطة أو الكود (مثلاً: OUD)…" oninput="render()">
<div id="list"></div>
<script src="data.js"></script>
<script>
function render(){
  const q = document.getElementById('search').value.trim().toUpperCase();
  const list = document.getElementById('list');
  list.innerHTML = '';
  Object.values(BLENDS).forEach((b, idx) => {
    if(q && !b.name.includes(q) && !b.key.includes(q)) return;
    const div = document.createElement('div');
    div.className = 'blend';
    div.innerHTML = `
      <h2>${b.name}</h2>
      <div class="key">الكود: ${b.key}</div>
      <div class="notes">${b.notes.map(n=>`<span>${n}</span>`).join('')}</div>
      <div class="size-tabs" data-idx="${idx}">
        <button onclick="setSize(${idx},30,this)">30ml</button>
        <button class="active" onclick="setSize(${idx},50,this)">50ml</button>
        <button onclick="setSize(${idx},100,this)">100ml</button>
      </div>
      <div class="recipe" id="recipe-${idx}"></div>
    `;
    list.appendChild(div);
    setSize(idx, 50);
  });
}
function setSize(idx, size, btn){
  if(btn){
    btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  const b = Object.values(BLENDS)[idx];
  const factor = size / 50;
  const items = b.recipe50.map(r => ({n: r.n, ml: Math.round(r.ml * factor)}));
  const total = items.reduce((s,i)=>s+i.ml,0);
  document.getElementById(`recipe-${idx}`).innerHTML =
    items.map(i=>`<div class="recipe-item"><span>${i.n}</span><span class="ml">${i.ml} ml</span></div>`).join('')
    + `<div class="total"><span>المجموع</span><span>${total} ml</span></div>`;
}
render();
</script>
</body>
</html>
